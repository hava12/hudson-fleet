# 플러그인 코드(화면 web/, 서버 fleet/·server.py·mcp_server.py)가 바뀌어 main 에 들어오면 React 화면을 빌드해 dist/ 를 커밋하고
# 플러그인 패치 버전을 1 올린다. 버전이 올라야 plugin update 가 새 코드를 받는다 — 서버만 고쳐도 올린다.
# 플러그인 설치는 git 을 그대로 받으므로 dist/ 가 저장소에 있어야 한다.
# GITHUB_TOKEN 으로 한 push 는 워크플로를 다시 띄우지 않는다.
name: web
on:
  push:
    branches: [main]
    paths: ['web/**', 'fleet/**', 'server.py', 'mcp_server.py']
permissions:
  contents: write
concurrency: web
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 앞 실행이 올린 버전 커밋까지 받는다 — push 한 커밋을 받으면 연달아 push 할 때 같은 버전을 다시 만든다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: 플러그인 패치 버전 +1
        id: ver
        run: |
          v=$(node -e '
            const f=".claude-plugin/plugin.json",p=require("./"+f),v=p.version.split(".");
            v[2]=+v[2]+1;p.version=v.join(".");
            require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n");console.log(p.version)')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: 커밋
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A dist .claude-plugin/plugin.json
          git commit -m "chore: 플러그인 ${{ steps.ver.outputs.v }} (웹 화면 빌드) [no-spec]"
          git pull --rebase && git push
