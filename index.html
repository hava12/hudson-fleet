<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hudson Fleet</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
<script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html-ui-base.min.js"></script>
<style>
:root{--warn:#b45309;--add:#067d17;--mod:#0032a0;--del:#6c707e;--bg:#f6f7f9;--fg:#0f172a;--mute:#64748b;--line:#e2e8f0;--card:#fff;--acc:#2563eb;--soft:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--warn:#fbbf24;--add:#629755;--mod:#6897bb;--del:#868a91;--bg:#0b1120;--fg:#e2e8f0;--mute:#94a3b8;--line:#1e293b;--card:#111827;--acc:#60a5fa;--soft:#1e293b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg)}
header{height:56px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 16px 0 0;letter-spacing:-.01em}header h1 span{color:var(--acc)}
input,button,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button:hover{background:var(--soft)}button.pri{background:var(--acc);color:#fff;border:0}button.sm{padding:2px 8px;font-size:12px}
main{display:grid;grid-template-columns:1fr var(--sidew,minmax(360px,38%));height:calc(100vh - 56px)}
#dash{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){header{height:auto;flex-wrap:wrap;padding:10px 16px}main{grid-template-columns:1fr;height:auto}#dash{padding:16px}#sidec{overflow:visible}#sideH{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:13px;margin:0;color:var(--mute);font-weight:600;letter-spacing:.02em}
.sh{display:flex;align-items:center;gap:6px 12px;margin-bottom:12px;flex-wrap:wrap}.sh h2{white-space:nowrap}
#cy{height:160px;border-radius:8px;background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:8px}.stat b{font-size:18px;line-height:1.3}
.stat span{font-size:12px;color:var(--mute)}.stat{cursor:pointer}.stat:hover{background:var(--soft)}.stat.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}
.tbl td{white-space:nowrap}td.loc{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);white-space:nowrap}
a.lk{color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none}a.lk:hover{color:var(--acc)}
.acts{white-space:nowrap}.acts button{margin-right:4px}.danger{color:#dc2626}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.post{display:flex;flex-direction:column;gap:8px}.post .ph{display:flex;gap:6px;align-items:baseline}
.post .ttl{font-weight:600;font-size:15px;line-height:1.35}
.post .body{font-size:13px;white-space:pre-wrap;word-break:break-word}.post .pf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
#side{overflow:hidden;border-left:1px solid var(--line);background:var(--card);position:relative;display:flex;flex-direction:column;min-width:0}
#sidec{flex:1;overflow:auto;padding:20px}
/* 왼쪽 가장자리를 끌어 폭 조절 — 패널은 스크롤하지 않고 안쪽(#sidec)만 스크롤해 손잡이가 제자리에 있다 */
#sideH{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}#sideH:hover,#sideH.on{background:var(--acc);opacity:.4}
main.noside{grid-template-columns:1fr}main.noside #side{display:none}#sideX{position:absolute;top:14px;right:14px}
h3{margin:0 0 4px;font-size:15px;word-break:break-all}h4{margin:16px 0 6px;font-size:14px;font-weight:600;color:var(--fg)}#hh{font-size:13px;color:var(--mute)}
.meta{color:var(--mute);font-size:12px;word-break:break-all}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;font-size:12px;max-height:50vh;overflow:auto}
details>summary{cursor:pointer}
#tree{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:13px}
#tree details{padding-left:14px}#tree>details{padding-left:6px}#tree summary{padding:1px 0;color:var(--mute)}
.f{display:flex;gap:8px;padding:2px 8px 2px 20px;cursor:pointer;border-radius:4px}.f:hover{background:var(--soft)}.f.on{background:var(--soft);font-weight:600}
.f .nm{flex:1;word-break:break-all}
/* A(생성)·M(수정)·D(삭제) — 색은 IntelliJ VCS 파일 상태 색 */
.st{font:700 11px ui-monospace,monospace;min-width:12px;text-align:center}
.st-A{--c:var(--add)}.st-M{--c:var(--mod)}.st-D{--c:var(--del)}.st,.f .nm.st-A,.f .nm.st-M,.f .nm.st-D{color:var(--c)}
.f .nm.st-D{text-decoration:line-through}.f .t{color:var(--mute);font-size:11px;white-space:nowrap}
.ev{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--card)}
.ev>summary{padding:6px 10px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.ev .d2h-wrapper{border-top:1px solid var(--line);font-size:12px}.ev .d2h-file-wrapper{margin:0;border:0;border-radius:0 0 8px 8px}
.ev .d2h-file-header{display:none}
.ev .d2h-wrapper{line-height:1.4}
.tag{padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-size:12px}
#menu{position:fixed;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0003;padding:4px;z-index:9}
#menu div{padding:6px 12px;border-radius:4px;cursor:pointer}#menu div:hover{background:var(--soft)}
nav{display:flex;gap:4px;height:100%}nav a{display:flex;align-items:center;padding:0 12px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent}
nav a:hover{color:var(--fg)}nav a.on{color:var(--fg);font-weight:600;border-bottom-color:var(--acc)}
.pg{display:flex;flex-direction:column;gap:16px}.pg[hidden]{display:none}#mcy{height:200px;border-radius:8px;background:var(--soft)}
.hu{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);white-space:nowrap}
.hu b{color:var(--fg);font-weight:600;min-width:28px}
.bar{width:64px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.gwrap{position:relative}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:color-mix(in srgb,var(--soft) 85%,transparent);color:var(--mute);font-size:14px;z-index:1}.loading[hidden]{display:none}
/* 점이 하나씩 늘었다 줄어드는 로딩 표시: 고정폭 글꼴의 ... 를 0→3글자 폭으로 잘라 보인다 */
.dots::after{content:'...';font-family:ui-monospace,monospace;display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{to{width:4ch}}
/* 기록한 작업: 1. 2. 3. 순서 + 분류(완료·중단·남은 일) */
.tasks{margin:0;padding-left:22px;font-size:13px;line-height:1.6}.tasks li{margin-bottom:6px}.tasks li::marker{color:var(--mute)}.tasks .pill{font-size:11px;margin-right:4px}.more{margin-top:2px;align-self:flex-start}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-left:auto}
</style></head><body>
<header><h1>Hudson <span>Fleet</span></h1>
<nav><a href="#home" data-pg="home">현황</a><a href="#history" data-pg="history">세션 기록</a><a href="#mcp" data-pg="mcp">MCP 서버</a></nav><span id="msg" class="meta" style="margin-left:auto"></span><div class="hu" id="hu"><span>사용량<span class="dots"></span></span></div>
</header>
<div id="menu"><div data-act="stop" class="danger">세션 종료</div></div>
<main id="main" class="noside"><div id="dash"><div class="pg" id="pg-home">
  <section class="card"><div class="sh"><h2>상태별 노드</h2><div class="legend" id="legend"></div></div>
    <div id="cy"></div><div class="stats" id="stats"></div></section>
  <section class="card"><div class="sh"><h2 id="tblh">위치별 실행 중인 세션</h2></div><div class="tw"><table id="tbl" class="tbl"></table></div></section>
  <section><div class="sh"><h2>작업 게시글</h2><span class="meta">정리해 둔 작업만 보여 줍니다 · 1분마다 갱신</span></div><div id="feed" class="meta">불러오는 중…</div></section>
</div><div class="pg" id="pg-history" hidden>
  <section class="card"><div class="sh"><h2>끝난 세션</h2><span class="meta" id="hsum"></span><button class="sm" id="href" style="margin-left:auto">새로 고침</button></div>
    <div class="tw"><table id="htbl" class="tbl"></table></div>
    <p class="meta" style="margin:10px 0 0">대시보드 서버가 켜져 있는 동안 끝난 세션을 1분 안에 저장합니다. 저장 전에 haiku 로 작업 내용을 요약합니다.</p></section>
</div><div class="pg" id="pg-mcp" hidden>
  <section class="card"><div class="sh"><h2>연결된 MCP 서버</h2><div class="legend" id="mlegend"></div><button class="sm" id="mref">다시 검사</button></div>
    <div class="gwrap"><div id="mcy"></div><div class="loading" id="mload" hidden>연결 상태 검사 중<span class="dots"></span>&nbsp;<span style="font-size:12px">(10초 정도 걸립니다)</span></div></div><div class="stats" id="mstats"></div>
    <p class="meta" style="margin:10px 0 0">홈 폴더 기준 목록입니다. 프로젝트 폴더에만 설정한 서버(.mcp.json)는 빠질 수 있습니다.</p></section>
</div></div>
<div id="side"><div id="sideH" title="끌어서 폭 조절 · 두 번 누르면 기본 폭"></div><button class="sm" id="sideX" title="패널 닫기">✕</button><div id="sidec"></div></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=ts=>ts?new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const day=ts=>ts?new Date(ts).toLocaleDateString('sv-SE'):'';  // 로컬 기준 YYYY-MM-DD
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
// 상태값(interactive 의 status, background 의 state) → 화면 분류
const GROUP={busy:'work',running:'work',blocked:'wait',waiting:'wait',needs_input:'wait',idle:'idle',
  stopped:'done',completed:'done',done:'done',failed:'fail'};
const GINFO={work:['작업 중','#16a34a'],wait:['입력 대기','#d97706'],idle:['쉬는 중','#64748b'],done:['끝남','#a8a29e'],fail:['실패','#dc2626']};
const grp=st=>GROUP[st]||'idle',isDead=st=>['done','fail'].includes(grp(st));  // 끝난 세션: 흐리게, 종료 메뉴 숨김
const FILL={project:dark?'#334155':'#475569',agent:'#7c3aed'};
const TASK={done:['완료','var(--add)'],stopped:['중단','var(--warn)'],todo:['남은 일','var(--mute)']};
const taskList=(ts,max,sid)=>`<ol class="tasks">${ts.slice(0,max||ts.length).map(t=>`<li><span class="pill" style="color:${TASK[t.status]?.[1]}">${TASK[t.status]?.[0]||esc(t.status)}</span> ${esc(t.text)}</li>`).join('')}</ol>`
  +(max&&ts.length>max?(sid?`<button class="sm more" data-act="more" data-sid="${esc(sid)}">더보기 (+${ts.length-max})</button>`:`<div class="meta">외 ${ts.length-max}건</div>`):'');
const taskSum=ts=>ts.length?Object.entries(TASK).filter(([k])=>ts.some(t=>t.status===k)).map(([k,[l,c]])=>`<span style="color:${c}">${l} ${ts.filter(t=>t.status===k).length}</span>`).join(' · '):'<span class="meta">없음</span>';
const pill=st=>`<span class="pill"><i class="dot" style="background:${GINFO[grp(st)][1]}"></i>${GINFO[grp(st)][0]}</span>`;
let G={nodes:[],edges:[],home:''};const tilde=p=>p&&G.home&&p.startsWith(G.home)?'~'+p.slice(G.home.length):p;
const LIVE=['work','wait','idle'];  // 메인 화면은 살아 있는 세션만 — 끝남·실패는 게시글에서만
$('legend').innerHTML=LIVE.map(k=>GINFO[k]).map(([l,c])=>`<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')
  +`<span><i class="dot" style="background:${FILL.project};border-radius:2px"></i>프로젝트</span><span><i class="dot" style="background:${FILL.agent};border-radius:2px"></i>서브에이전트</span>`;
const ctx=document.createElement('canvas').getContext('2d');ctx.font='12px system-ui';
// 이름을 상자 안에 넣는다 — 연결선이 상자 테두리에 붙어 이름을 가로지르지 않는다
const cy=cytoscape({container:$('cy'),wheelSensitivity:0.3,maxZoom:1,minZoom:0.3,style:[
  {selector:'node',style:{shape:'round-rectangle',label:'data(short)',width:'data(w)',height:28,'font-size':12,color:'#fff',
    'text-valign':'center','text-halign':'center','background-color':e=>e.data('type')==='session'?GINFO[grp(e.data('status'))][1]:FILL[e.data('type')],'border-width':0}},
  {selector:'node[type="project"]',style:{'font-weight':'bold'}},
  {selector:'.faded',style:{opacity:0.12}},
  {selector:'edge',style:{width:1.5,'line-color':dark?'#57534e':'#d6d3d1','target-arrow-color':dark?'#57534e':'#d6d3d1',
    'target-arrow-shape':'triangle','arrow-scale':0.8,'curve-style':'taxi','taxi-direction':'rightward','taxi-turn':'50%'}},
  {selector:':selected',style:{'overlay-color':'#c2410c','overlay-opacity':0.2,'overlay-padding':4}}]});
// 그래프 영역 높이를 내용에 맞춘다. 확대는 1배까지 — 노드가 적을 때 글씨가 커지지 않게
function fitBox(c,max){const el=c.container(),h=c.elements().boundingBox().h;
  el.style.height=Math.min(Math.max(h+48,120),max)+'px';c.resize();c.fit(undefined,24)}
let sig='';
async function load(){
  const g=G=await (await fetch('/api/graph')).json();
  // 끝난 세션과 그 서브에이전트, 살아 있는 세션이 없는 프로젝트는 빼고 시작한다
  const gone=new Set(g.nodes.filter(n=>n.type==='session'&&isDead(n.status)).map(n=>n.sessionId));
  g.nodes=g.nodes.filter(n=>!gone.has(n.type==='session'?n.sessionId:n.sid)&&!(n.type==='agent'&&isDead(n.status)));  // 끝난 서브에이전트도 뺀다
  const ids=new Set(g.nodes.map(n=>n.id));g.edges=g.edges.filter(e=>ids.has(e.source)&&ids.has(e.target));
  const used=new Set(g.edges.map(e=>e.source));g.nodes=g.nodes.filter(n=>n.type!=='project'||used.has(n.id));
  g.nodes.forEach(n=>{const l=n.label||'';
    n.short=l.length>26?l.slice(0,25)+'…':l;n.w=Math.ceil(ctx.measureText(n.short).width)+24});
  renderStats(g);renderTable(g);
  const s=g.nodes.map(n=>n.id).sort().join()+'|'+g.edges.length;
  if(s===sig){g.nodes.forEach(n=>cy.getElementById(n.id).data(n));return} // 구조 그대로면 상태만 갱신
  sig=s;cy.elements().remove();
  cy.add([...g.nodes.map(d=>({data:d})),...g.edges.map(e=>({data:{id:e.source+'>'+e.target,...e}}))]);
  cy.layout({name:'dagre',rankDir:'LR',nodeSep:14,rankSep:60}).run();
  fitBox(cy,420);
  renderTable(g);
}

// ── 오른쪽 탐색기 ──
let cur=null; // {s: 세션 노드 데이터, changes, by}
cy.on('tap','node',e=>{
  const d=e.target.data();
  if(d.type==='project'){if(sameAgain(d.id))return;sideBox().innerHTML=`<h3>${esc(d.label)}</h3><p class="meta">${esc(tilde(d.id.slice(2)))} · 세션 ${e.target.outgoers('node').length}개</p>`;return}
  openSession(d.type==='agent'?d.sid:d.sessionId,d.type==='agent'?d.label:null);
});
async function openSession(sid,agent,keepOpen){  // keepOpen: 이미 열려 있어도 닫지 않는다 (더보기)
  const s=G.nodes.find(n=>n.sessionId===sid);if(!s)return;
  if(keepOpen){sideKey='s:'+sid}else if(sameAgain('s:'+sid+(agent||'')))return;
  cy.$(':selected').unselect();cy.getElementById('s:'+sid).select();
  const r=await (await fetch('/api/session?sid='+encodeURIComponent(sid))).json();
  cur={s,changes:agent?r.changes.filter(c=>c.by===agent):r.changes,overview:r.overview,proc:r.proc,home:r.home,status:r.status||{},tasks:r.tasks||[],agent};
  renderSide();if(innerWidth<=900)$('side').scrollIntoView({behavior:'smooth'});
}
let statF='';  // 숫자 타일로 고른 상태 ('' = 전체)
const pick=n=>statF==='agent'?G.nodes.some(a=>a.type==='agent'&&a.sid===n.sessionId):grp(n.status)===statF;
function setStat(k){statF=statF===k?'':k;renderStats(G);renderTable(G);
  if(statF)$('tblh').scrollIntoView({behavior:'smooth',block:'center'})}
$('stats').addEventListener('click',e=>{const t=e.target.closest('.stat');if(t)setStat(t.dataset.g)});
function renderStats(g){
  const ss=g.nodes.filter(n=>n.type==='session'),cnt={};ss.forEach(n=>cnt[grp(n.status)]=(cnt[grp(n.status)]||0)+1);
  $('stats').innerHTML=LIVE.map(k=>[k,GINFO[k]]).map(([k,[l,c]])=>`<div class="stat${statF===k?' on':''}" data-g="${k}"><b style="color:${cnt[k]?c:'var(--mute)'}">${cnt[k]||0}</b><span><i class="dot" style="background:${c}"></i>${l}</span></div>`).join('')
    +`<div class="stat${statF==='agent'?' on':''}" data-g="agent"><b>${g.nodes.filter(n=>n.type==='agent').length}</b><span><i class="dot" style="background:${FILL.agent}"></i>서브에이전트</span></div>`;
}
function renderTable(g){
  const by={};g.nodes.filter(n=>n.type==='session'&&(!statF||pick(n))).forEach(n=>(by[n.cwd]??=[]).push(n));
  const rows=Object.keys(by).sort().map(cwd=>by[cwd].sort((a,b)=>b.startedAt-a.startedAt).map((n,i)=>`<tr>
    ${i?'':`<td class="loc" rowspan="${by[cwd].length}" title="${esc(cwd)}">${esc(tilde(cwd))}</td>`}
    <td><a class="lk" data-act="open" data-sid="${esc(n.sessionId)}">${esc(n.label||n.sessionId.slice(0,8))}</a><div class="meta">${when(n.startedAt)} 시작</div></td>
    <td>${pill(n.status)}</td><td>${esc(n.kind==='background'?'백그라운드':n.app||'?')}</td>
    <td class="acts"><button class="sm danger" data-act="stop" data-sid="${esc(n.sessionId)}">종료</button></td></tr>`).join('')).join('');

function tree(files,home){ // 홈(~) 기준 전체 경로 → 중첩 객체 → <details> 폴더 트리
  const root={};
  for(const f in files){const rel=f.startsWith(home+'/')?'~'+f.slice(home.length):f;let n=root;
    const parts=rel.split('/');if(parts[0]==='')parts[0]='/';  // 홈 밖 파일은 / 부터
    parts.forEach((p,i)=>{if(i===parts.length-1)(n.__f??=[]).push([p,f]);else n=n[p]??={}})}
  // 하위 폴더 하나뿐인 폴더는 한 줄로 합친다 (~ › Project › x → ~/Project/x)
  const squash=(k,n)=>{for(let ks;!n.__f&&(ks=Object.keys(n)).length===1;n=n[ks[0]])k=(k==='/'?'':k)+'/'+ks[0];return [k,n]};
  const render=n=>Object.keys(n).filter(k=>k!=='__f').sort().map(k0=>{const [k,c]=squash(k0,n[k0]);
    return `<details open><summary title="${esc(k)}">📁 ${esc(k)}</summary>${render(c)}</details>`}).join('')
    +(n.__f||[]).sort().map(([p,f])=>{const ev=files[f],lastTs=ev[ev.length-1].ts;
      return `<div class="f" data-p="${esc(f)}"><span class="nm st-${cur.status[f]||'M'}">📄 ${esc(p)}</span><b class="st st-${cur.status[f]||'M'}">${cur.status[f]||'M'}</b><span class="t">${ev.length}회 · ${when(lastTs)}</span></div>`}).join('');
  return render(root)||'<div class="meta" style="padding:4px 10px">변경한 파일 없음</div>';
}

    <div class="meta">${when(s.started_at)} → ${when(s.ended_at)} · 토큰 ${fmtTok(s.tokens)}</div>
    <details open><summary><h4 style="display:inline-block">기록한 작업 · ${s.tasks.length}건</h4></summary>${s.tasks.length?taskList(s.tasks):'<div class="meta">기록할 작업 없음</div>'}</details>
    <details open><summary><h4 style="display:inline-block">바뀐 파일 · ${s.files.length}개</h4></summary>
    <div id="tree" style="padding:6px 0">${s.files.map(f=>`<div class="f" style="cursor:default" title="${esc(f.path)}"><span class="nm st-${f.status}">📄 ${esc(tilde(f.path))}</span>
      <b class="st st-${f.status}">${f.status}</b><span class="t">${f.edits}회 · +${f.added} −${f.removed}</span></div>`).join('')||'<div class="meta" style="padding:4px 10px">없음</div>'}</div></details>`});
$('href').onclick=loadHistory;
// ── 상단 메뉴: #home / #history / #mcp ──
function route(){
  const pg={'#mcp':'mcp','#history':'history'}[location.hash]||'home';
  document.querySelectorAll('.pg').forEach(x=>x.hidden=x.id!=='pg-'+pg);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.pg===pg));
  sideClose();
  if(pg==='mcp'&&!mcy)loadMcp();
  if(pg==='history')loadHistory();
  if(pg==='home')fitBox(cy,420);  // 숨겨진 채로 그려졌을 수 있다
}
addEventListener('hashchange',route);
load().catch(()=>{}).finally(route);setInterval(load,5000);  // 홈 경로(~ 표시용)를 먼저 받고 페이지를 그린다
const keep=(fn,ms)=>{const run=()=>fn().then(()=>setTimeout(run,ms),()=>setTimeout(run,3000));run()};  // 실패하면 3초 뒤 다시
keep(loadFeed,60000);keep(loadUsage,60000);
</script></body></html>
